name: CI

on:
  push:
  pull_request:

jobs:
  framework-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate framework
        run: python .github/scripts/validate_framework.py

      - name: Run self test
        run: python .github/scripts/selftest.py
