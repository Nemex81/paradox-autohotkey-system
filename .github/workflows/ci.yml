name: CI

on:
  push:
  pull_request:

jobs:
  framework-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate framework
        run: python .github/scripts/validate_framework.py

      - name: Explicit framework files check
        run: echo "Framework required_paths validated by validate_framework.py"

      - name: Run self test
        run: python .github/scripts/selftest.py

      - name: Generate sample addon for lint
        run: |
          python .github/scripts/bootstrap_addon.py \
            --addon-id ciDemo \
            --addon-name "CI Demo" \
            --author "CI" \
            --version 0.1.0 \
            --description "CI lint sample" \
            --output-dir .github/.tmp_ci_addons

      - name: Lint generated addon
        run: python .github/scripts/lint_addon.py --root .github/.tmp_ci_addons
